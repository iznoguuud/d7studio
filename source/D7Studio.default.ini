; D7 Studio - the settings of a new installation. Setup installs this file as Delphi 7's
; Bin\D7Studio.ini when Bin has none (installer\D7Studio.iss), and D7 Studio keeps its settings
; there from then on (SdSettings.SettingsDir).
;
; [Transfer] holds the tool Migrate from Delphi 7: migrate.exe, whose dialog takes Delphi 7's
; configuration into these settings. Its program is written here without a folder; Setup gives it
; Bin's full name (D7 Studio does not expand $(DELPHI) in a tool's program), in this file and in a
; D7Studio.ini that Bin had already.
;
; It has no [Design Packages]: Setup writes the section (AddExpertPackages) - Borland's standard
; packages and the two experts it installs into Projects\Bpl, the AI harness and Git -, in this file and in a
; D7Studio.ini that Bin had already, which gets each expert it does not list; migrate.exe adds
; Delphi 7's packages to them.
;
; Made from a developer's settings without what belongs to one machine or one person's work
; (window position, recent files and projects, histories, per-file encodings, own packages), and
; without what D7 Studio works out better itself: the fonts, the editor's colour theme, the
; arrangement of the views and the desktops, the file types other than Pascal.

